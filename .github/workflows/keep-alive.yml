name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *" # Every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl -L --fail --silent --show-error \
          https://mcq-analysis-apps-server.onrender.com/health