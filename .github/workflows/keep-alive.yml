name: Keep Render Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render
        run: |
          curl -L -o /dev/null -s -w "HTTP Status: %{http_code}\n" https://mcq-analysis-apps-server.onrender.com/health